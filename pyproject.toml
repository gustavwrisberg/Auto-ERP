[project]
name = "auto-erp"
version = "0.1.0"
description = "Demo: Claude automates supplier-invoice intake for a small Danish company, with a human approving every booking."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "claude-agent-sdk>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
